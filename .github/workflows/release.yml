# Push a tag like v1.2.0 to publish a release tarball (used by install.sh)
# and a multi-arch image at ghcr.io/zer0contextlost/argus-nvr.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  tarball:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        run: npm ci --no-audit --no-fund && npm run build
      - name: Package
        run: |
          mkdir -p stage/argus-nvr/frontend
          cp -a sentinel installer install.sh requirements.txt requirements-face.txt LICENSE README.md stage/argus-nvr/
          cp -a frontend/dist stage/argus-nvr/frontend/
          echo "${GITHUB_REF_NAME}" > stage/argus-nvr/VERSION
          tar czf argus-nvr.tar.gz -C stage argus-nvr
          sha256sum argus-nvr.tar.gz > argus-nvr.tar.gz.sha256
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" argus-nvr.tar.gz argus-nvr.tar.gz.sha256 --generate-notes

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
